version: "3.9"

services:
  meal-bot:
    build: .
    container_name: meal-tracking-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - meal-net

  # Optional: n8n for visual workflow editing
  n8n:
    image: n8nio/n8n:latest
    container_name: meal-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - meal-net

networks:
  meal-net:
    driver: bridge

volumes:
  n8n_data:
